<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>৯০ দিন টেস্ট প্রিপারেশন | HulkenStein Infinity School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#070c1a;
  --navy-900:#0b1330;
  --navy-800:#101a42;
  --navy-700:#172256;
  --navy-600:#212f6e;
  --gold-500:#e0b24d;
  --gold-400:#f3cd6f;
  --gold-300:#f8dd97;
  --teal-400:#3ee0c2;
  --coral-400:#ff7a68;
  --ink-050:#f7f4ec;
  --ink-100:#eee8d8;
  --ink-300:#c8c2ae;
  --ink-500:#8f89a3;
  --success:#3ee0c2;
  --danger:#ff7a68;
  --glass:rgba(255,255,255,0.045);
  --glass-brd:rgba(224,178,77,0.22);
  --shadow-lg:0 30px 80px -20px rgba(2,4,16,0.65);
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --font-display:'Noto Serif Bengali','Manrope',serif;
  --font-body:'Noto Sans Bengali','Manrope',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(circle at 15% 8%, rgba(62,224,194,0.10), transparent 45%),
    radial-gradient(circle at 88% 18%, rgba(224,178,77,0.14), transparent 42%),
    radial-gradient(circle at 50% 100%, rgba(33,47,110,0.55), transparent 60%),
    linear-gradient(160deg, var(--navy-950), var(--navy-900) 55%, #0a0f24 100%);
  background-attachment:fixed;
  color:var(--ink-050);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-500);color:var(--navy-950);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold-500),var(--teal-400));border-radius:10px;}

a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:.2px;}
p{margin:0;}

/* ---------- Particle canvas ---------- */
#particle-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55;}

/* ---------- App container ---------- */
#app{position:relative;z-index:1;min-height:100vh;}

/* ================= HERO ================= */
.hero{
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 20px;position:relative;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-brd);
  color:var(--gold-300);font-size:12.5px;letter-spacing:2px;text-transform:uppercase;
  opacity:0;animation:fadeUp .9s ease .1s forwards;
  margin-bottom:26px;
}
.hero-logo{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(224,178,77,.35));margin-bottom:18px;opacity:0;animation:fadeUp .9s ease 0s forwards;border-radius:14px;background:radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);}
.hero h1{
  font-size:clamp(40px,8vw,84px);
  line-height:1.05;
  font-weight:800;
  background:linear-gradient(100deg,var(--ink-050) 10%,var(--gold-300) 45%,var(--teal-400) 75%,var(--ink-050) 100%);
  background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fadeUp 1s ease .2s forwards, shine 7s linear 1.2s infinite;
  opacity:0;
}
.hero h1 span{display:block;font-size:.42em;letter-spacing:6px;font-weight:600;color:var(--ink-300);-webkit-text-fill-color:var(--ink-300);margin-bottom:10px;font-family:var(--font-body);}
.hero-sub{
  max-width:620px;margin-top:22px;font-size:17px;color:var(--ink-300);line-height:1.75;
  opacity:0;animation:fadeUp 1s ease .4s forwards;
}
.hero-stats{display:flex;gap:34px;margin-top:44px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fadeUp 1s ease .55s forwards;}
.hero-stat{text-align:center;}
.hero-stat b{display:block;font-family:var(--font-display);font-size:30px;color:var(--gold-400);}
.hero-stat span{font-size:12px;color:var(--ink-500);letter-spacing:1px;}
.hero-cta{
  margin-top:48px;opacity:0;animation:fadeUp 1s ease .7s forwards;
  display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
}
.btn{
  position:relative;overflow:hidden;
  padding:16px 34px;border-radius:999px;border:none;
  font-size:16px;font-weight:700;letter-spacing:.3px;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.3), box-shadow .35s ease;
}
.btn-primary{
  background:linear-gradient(120deg,var(--gold-400),var(--gold-500) 60%, #c98f2e);
  color:#1a1204;
  box-shadow:0 14px 32px -8px rgba(224,178,77,.55);
}
.btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 20px 42px -10px rgba(224,178,77,.7);}
.btn-primary::after{
  content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite;
}
.btn-ghost{
  background:var(--glass);border:1px solid var(--glass-brd);color:var(--ink-100);
}
.btn-ghost:hover{transform:translateY(-3px);background:rgba(255,255,255,.08);}
.btn-sm{padding:10px 20px;font-size:13.5px;border-radius:999px;}
.btn-block{width:100%;}
.btn-danger{background:linear-gradient(120deg,#ff8a76,var(--coral-400));color:#2b0800;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;}

@keyframes fadeUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}
@keyframes shine{0%{background-position:0% 50%;}100%{background-position:220% 50%;}}
@keyframes sheen{0%{left:-60%;}100%{left:140%;}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pop{0%{transform:scale(.5);opacity:0;}60%{transform:scale(1.06);opacity:1;}100%{transform:scale(1);}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(62,224,194,.55);}100%{box-shadow:0 0 0 22px rgba(62,224,194,0);}}
@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}
@keyframes glowPulse{0%,100%{opacity:.5;}50%{opacity:1;}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes checkDraw{to{stroke-dashoffset:0;}}

.orb{position:absolute;border-radius:50%;filter:blur(2px);animation:floatY 8s ease-in-out infinite;opacity:.5;pointer-events:none;}

/* ================= PROFILE MODAL ================= */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,6,16,.72);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
  animation:fadeUp .4s ease forwards;
}
.modal-card{
  width:100%;max-width:460px;background:linear-gradient(165deg, var(--navy-800), var(--navy-900));
  border:1px solid var(--glass-brd);border-radius:var(--radius-lg);padding:36px 30px;
  box-shadow:var(--shadow-lg);animation:pop .5s cubic-bezier(.2,.9,.3,1.2) forwards;
  max-height:88vh;overflow-y:auto;
}
.modal-eyebrow{color:var(--gold-400);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;display:block;}
.modal-card h2{font-size:26px;margin-bottom:6px;}
.modal-desc{color:var(--ink-300);font-size:14px;margin-bottom:24px;line-height:1.6;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;color:var(--ink-300);margin-bottom:7px;letter-spacing:.3px;}
.field input{
  width:100%;padding:13px 16px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  color:var(--ink-050);font-size:15px;font-family:inherit;transition:border-color .25s, background .25s;
}
.field input:focus{outline:none;border-color:var(--gold-500);background:rgba(255,255,255,.08);}
.modal-actions{display:flex;gap:12px;margin-top:8px;}
.form-error{color:var(--coral-400);font-size:12.5px;margin-top:6px;min-height:14px;}

/* ================= HEADER / DASHBOARD LAYOUT ================= */
.app-header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 28px;background:rgba(7,12,26,.75);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{width:36px;height:36px;border-radius:9px;}
.brand-text b{display:block;font-family:var(--font-display);font-size:16px;color:var(--ink-050);}
.brand-text span{font-size:10.5px;color:var(--gold-400);letter-spacing:1.4px;}
.header-right{display:flex;align-items:center;gap:14px;}
.student-chip{
  display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-brd);cursor:pointer;transition:.25s;
}
.student-chip:hover{background:rgba(255,255,255,.08);}
.avatar-circle{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-400),var(--teal-400));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#12102a;font-size:14px;
}
.student-chip .meta{display:flex;flex-direction:column;line-height:1.15;}
.student-chip .meta b{font-size:12.5px;color:var(--ink-050);}
.student-chip .meta span{font-size:10.5px;color:var(--ink-500);}
.nav-icon-btn{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--glass);border:1px solid var(--glass-brd);color:var(--ink-100);transition:.25s;font-size:16px;
}
.nav-icon-btn:hover{background:rgba(255,255,255,.08);transform:rotate(20deg);}

.view-wrap{max-width:1180px;margin:0 auto;padding:34px 22px 90px;}

/* ================= DASHBOARD ================= */
.dash-hero{
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px;
}
.dash-hero h2{font-size:clamp(26px,4vw,36px);}
.dash-hero p{color:var(--ink-300);margin-top:6px;font-size:14.5px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;font-size:11.5px;letter-spacing:.5px;font-weight:700;}
.pill-gold{background:rgba(224,178,77,.15);color:var(--gold-400);border:1px solid rgba(224,178,77,.3);}
.pill-teal{background:rgba(62,224,194,.13);color:var(--teal-400);border:1px solid rgba(62,224,194,.3);}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px;}
.stat-card{
  background:var(--glass);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-md);
  padding:20px;position:relative;overflow:hidden;transition:transform .3s ease, border-color .3s;
}
.stat-card:hover{transform:translateY(-4px);border-color:var(--glass-brd);}
.stat-card .icon{font-size:22px;margin-bottom:10px;display:block;}
.stat-card b{font-family:var(--font-display);font-size:28px;display:block;color:var(--ink-050);}
.stat-card span{font-size:12px;color:var(--ink-500);}
.stat-card .glow{position:absolute;width:90px;height:90px;border-radius:50%;filter:blur(30px);opacity:.35;top:-30px;right:-30px;}

.big-progress{
  background:linear-gradient(135deg, rgba(224,178,77,.09), rgba(62,224,194,.06));
  border:1px solid var(--glass-brd);border-radius:var(--radius-lg);padding:26px 28px;margin-bottom:30px;
  display:flex;align-items:center;gap:30px;flex-wrap:wrap;
}
.ring-wrap{position:relative;width:120px;height:120px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10;}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-label b{font-family:var(--font-display);font-size:24px;}
.ring-label span{font-size:10px;color:var(--ink-500);}
.big-progress-info{flex:1;min-width:220px;}
.big-progress-info h3{font-size:19px;margin-bottom:6px;}
.big-progress-info p{color:var(--ink-300);font-size:13.5px;line-height:1.6;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:34px 0 16px;}
.section-title h3{font-size:20px;}
.section-title .hint{font-size:12.5px;color:var(--ink-500);}

.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:10px;}
.subject-card{background:var(--glass);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius-md);padding:16px;transition:.25s;}
.subject-card:hover{border-color:var(--glass-brd);transform:translateY(-3px);}
.subject-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.subject-card .top b{font-size:13.5px;}
.subject-card .top span{font-size:11.5px;color:var(--gold-400);font-weight:700;}
.bar-track{height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal-400),var(--gold-400));transition:width 1s cubic-bezier(.2,.8,.2,1);}

/* Day grid */
.day-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.filter-btn{padding:8px 16px;border-radius:999px;font-size:12.5px;background:var(--glass);border:1px solid rgba(255,255,255,.09);color:var(--ink-300);transition:.2s;}
.filter-btn.active{background:linear-gradient(120deg,var(--gold-400),var(--gold-500));color:#1a1204;border-color:transparent;}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;}
.day-tile{
  position:relative;border-radius:var(--radius-md);padding:16px 10px 12px;text-align:center;
  background:var(--glass);border:1px solid rgba(255,255,255,.08);transition:transform .25s, box-shadow .25s;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;
}
.day-tile.unlocked{cursor:pointer;}
.day-tile.unlocked:hover{transform:translateY(-5px);box-shadow:0 14px 30px -10px rgba(0,0,0,.5);border-color:var(--glass-brd);}
.day-tile.current{border-color:var(--teal-400);box-shadow:0 0 0 3px rgba(62,224,194,.18);}
.day-tile.completed{background:linear-gradient(160deg, rgba(62,224,194,.14), rgba(62,224,194,.03));border-color:rgba(62,224,194,.35);}
.day-tile.revision{background:linear-gradient(160deg, rgba(255,122,104,.13), rgba(255,122,104,.02));}
.day-tile.locked{opacity:.38;cursor:not-allowed;}
.day-tile .dnum{font-family:var(--font-display);font-size:20px;font-weight:700;}
.day-tile .dlabel{font-size:9.5px;color:var(--ink-500);letter-spacing:.5px;}
.day-tile .dicon{font-size:15px;}
.day-tile .lock-ico{position:absolute;top:8px;right:9px;font-size:11px;opacity:.6;}
.day-tile .check-ico{position:absolute;top:7px;right:9px;width:16px;height:16px;border-radius:50%;background:var(--teal-400);display:flex;align-items:center;justify-content:center;font-size:9px;color:#04231d;}

/* ================= DAY DETAIL VIEW ================= */
.day-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px;
}
.day-header .left{display:flex;align-items:center;gap:16px;}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--ink-300);font-size:13.5px;padding:8px 4px;transition:.2s;}
.back-btn:hover{color:var(--gold-400);}
.day-title-block h2{font-size:clamp(24px,4vw,32px);}
.day-title-block p{color:var(--ink-500);font-size:13px;margin-top:4px;}
.day-nav-btns{display:flex;gap:10px;}

.subject-block{
  background:linear-gradient(160deg, var(--glass), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-lg);
  padding:24px;margin-bottom:20px;position:relative;overflow:hidden;
  animation:slideIn .5s ease forwards;
}
.subject-block.is-revision{border-color:rgba(255,122,104,.35);background:linear-gradient(160deg, rgba(255,122,104,.09), rgba(255,255,255,.02));}
.subject-block .subj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.subj-eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold-400);font-weight:700;}
.subj-topic{font-size:19px;margin-top:4px;font-family:var(--font-display);}
.covered-note{margin-top:10px;font-size:12.5px;color:var(--ink-300);background:rgba(255,255,255,.04);padding:10px 14px;border-radius:10px;line-height:1.6;}
.task-list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:9px;}
.task-list li{
  display:flex;gap:10px;font-size:14px;color:var(--ink-100);line-height:1.6;
  padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.03);
}
.task-list li .tnum{color:var(--gold-400);font-weight:700;flex-shrink:0;}

.status-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px dashed rgba(255,255,255,.1);padding-top:16px;}
.radio-group{display:flex;gap:10px;}
.radio-opt{
  display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);font-size:13px;
  cursor:pointer;transition:.25s;
}
.radio-opt input{display:none;}
.radio-opt .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-500);transition:.25s;display:flex;align-items:center;justify-content:center;}
.radio-opt.done{background:rgba(62,224,194,.14);border-color:rgba(62,224,194,.4);color:var(--teal-400);}
.radio-opt.done .dot{border-color:var(--teal-400);background:var(--teal-400);}
.radio-opt.notdone{background:rgba(255,122,104,.12);border-color:rgba(255,122,104,.35);color:var(--coral-400);}
.radio-opt.notdone .dot{border-color:var(--coral-400);background:var(--coral-400);}

.notes-box{margin-top:16px;}
.notes-box label{font-size:12px;color:var(--ink-500);display:block;margin-bottom:6px;letter-spacing:.4px;}
.notes-box textarea{
  width:100%;min-height:70px;padding:12px 14px;border-radius:12px;resize:vertical;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--ink-050);
  font-family:inherit;font-size:13.5px;line-height:1.6;transition:border-color .25s;
}
.notes-box textarea:focus{outline:none;border-color:var(--gold-500);}

.day-complete-cta{
  display:flex;justify-content:center;margin-top:30px;flex-direction:column;align-items:center;gap:12px;
}
.day-progress-hint{font-size:12.5px;color:var(--ink-500);}

/* ================= CONGRATS MODAL ================= */
.congrats-card{
  width:100%;max-width:440px;text-align:center;padding:44px 32px 36px;
  background:radial-gradient(circle at 50% 0%, rgba(224,178,77,.18), transparent 60%), linear-gradient(165deg, var(--navy-800), var(--navy-900));
  border:1px solid var(--glass-brd);border-radius:26px;position:relative;overflow:hidden;
  animation:pop .55s cubic-bezier(.2,.9,.3,1.2) forwards;
}
.check-circle{
  width:86px;height:86px;border-radius:50%;margin:0 auto 20px;
  background:radial-gradient(circle, rgba(62,224,194,.22), transparent 70%);
  display:flex;align-items:center;justify-content:center;
  animation:ringPulse 1.8s ease-out infinite;
}
.check-circle svg{width:52px;height:52px;}
.check-circle svg path{stroke:var(--teal-400);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:checkDraw .7s ease .3s forwards;}
.congrats-card h2{font-size:24px;margin-bottom:6px;color:var(--gold-300);}
.congrats-card .sub{font-size:15px;color:var(--ink-050);font-weight:600;margin-bottom:14px;}
.congrats-card .msg{font-size:13.5px;color:var(--ink-300);line-height:1.7;margin-bottom:26px;}
.confetti-piece{position:fixed;top:-10px;width:9px;height:14px;z-index:300;pointer-events:none;animation:confettiFall linear forwards;}

/* ================= SETTINGS ================= */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
.settings-card{background:var(--glass);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-lg);padding:22px;}
.settings-card h4{font-size:16px;margin-bottom:8px;}
.settings-card p{font-size:13px;color:var(--ink-300);margin-bottom:16px;line-height:1.6;}

/* ================= CONFIRM DIALOG ================= */
.confirm-card{max-width:400px;text-align:center;padding:32px 26px;}
.confirm-card .warn-ico{font-size:34px;margin-bottom:10px;}

/* misc */
.empty-note{color:var(--ink-500);font-size:13px;text-align:center;padding:30px 0;}
.footer-credit{text-align:center;color:var(--ink-500);font-size:11.5px;margin-top:50px;letter-spacing:.4px;}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);
  background:var(--navy-800);border:1px solid var(--glass-brd);color:var(--ink-050);
  padding:12px 22px;border-radius:999px;font-size:13px;z-index:400;opacity:0;transition:.35s;
  box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:640px){
  .app-header{padding:12px 14px;}
  .student-chip .meta{display:none;}
  .view-wrap{padding:22px 14px 70px;}
  .big-progress{padding:20px;}
  .day-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));}
}

<script>
/* ============================================================
   90 DAYS TEST PREPARATION — HulkenStein Infinity School
   Self-contained SPA. All data persisted via localStorage.
   ============================================================ */
(function(){
"use strict";

var DAYS = JSON.parse(document.getElementById('days-data').textContent);
var TOTAL_DAYS = DAYS.length;
var LS_PREFIX = "hkiSSC90_";
var KEYS = {
  profile: LS_PREFIX+"profile",
  progress: LS_PREFIX+"progress", // {day: {subjIndex: 'done'|'notdone'}}
  notes: LS_PREFIX+"notes",       // {day: text}
  completedDays: LS_PREFIX+"completedDays", // array of day numbers
  currentDay: LS_PREFIX+"currentDay"
};

var LOGO_SVG = '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%23f3cd6f"/><stop offset="1" stop-color="%233ee0c2"/></linearGradient></defs><circle cx="32" cy="32" r="30" fill="none" stroke="url(%23lg1)" stroke-width="3"/><text x="32" y="40" font-size="26" text-anchor="middle" fill="%23f3cd6f" font-family="serif" font-weight="700">∞</text></svg>';

/* ---------------- Storage helpers ---------------- */
function lsGet(key, fallback){
  try{
    var v = localStorage.getItem(key);
    if(v===null) return fallback;
    return JSON.parse(v);
  }catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

function getProfile(){ return lsGet(KEYS.profile, null); }
function setProfile(p){ lsSet(KEYS.profile, p); }
function getProgress(){ return lsGet(KEYS.progress, {}); }
function setProgress(p){ lsSet(KEYS.progress, p); }
function getNotes(){ return lsGet(KEYS.notes, {}); }
function setNotes(n){ lsSet(KEYS.notes, n); }
function getCompletedDays(){ return lsGet(KEYS.completedDays, []); }
function setCompletedDays(arr){ lsSet(KEYS.completedDays, arr); }
function getCurrentDay(){ return lsGet(KEYS.currentDay, 1); }
function setCurrentDay(d){ lsSet(KEYS.currentDay, d); }

/* ---------------- App State ---------------- */
var state = {
  view: 'hero', // hero | dashboard | day | settings
  activeDay: 1,
  dayFilter: 'all' // all|study|revision|pending
};

var root = document.getElementById('app');

/* ---------------- Utility ---------------- */
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs||{};
  for(var k in attrs){
    var v = attrs[k];
    if(v===null || v===undefined) continue; // skip falsy handlers like onclick:null on locked tiles
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k.indexOf('on')===0 && typeof v==='function') e.addEventListener(k.slice(2), v);
    else if(k==='disabled' || k==='checked' || k==='readOnly' || k==='required'){
      // boolean DOM properties: must be set as real booleans, never as a string attribute,
      // otherwise disabled="false" would still disable the element.
      e[k] = !!v;
    }
    else e.setAttribute(k, v);
  }
  (children||[]).forEach(function(c){
    if(c===null||c===undefined) return;
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function fmtDate(d){
  if(!d) return '—';
  try{
    var parts = d.split('-');
    if(parts.length===3){
      var months=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
      return parseInt(parts[2],10)+" "+months[parseInt(parts[1],10)-1]+", "+parts[0];
    }
    return d;
  }catch(e){ return d; }
}
function toast(msg){
  var t = document.querySelector('.toast');
  if(!t){
    t = el('div',{class:'toast'});
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ---------------- Day completion logic ---------------- */
function isDayComplete(dayNum){
  var completed = getCompletedDays();
  return completed.indexOf(dayNum) !== -1;
}
function isDayUnlocked(dayNum){
  if(dayNum===1) return true;
  // A day is unlocked only when the previous day is completed (sequential; no auto-skip)
  return isDayComplete(dayNum-1);
}
function getDaySubjectStatus(dayNum, subjIdx){
  var prog = getProgress();
  return (prog[dayNum] && prog[dayNum][subjIdx]) || null;
}
function setDaySubjectStatus(dayNum, subjIdx, status){
  var prog = getProgress();
  if(!prog[dayNum]) prog[dayNum] = {};
  prog[dayNum][subjIdx] = status;
  setProgress(prog);
}
function isAllSubjectsDone(dayNum){
  var dayObj = DAYS[dayNum-1];
  var prog = getProgress();
  var dp = prog[dayNum] || {};
  for(var i=0;i<dayObj.subjects.length;i++){
    if(dp[i] !== 'done') return false;
  }
  return true;
}
function getDayDoneCount(dayNum){
  var dayObj = DAYS[dayNum-1];
  var prog = getProgress();
  var dp = prog[dayNum] || {};
  var c=0;
  dayObj.subjects.forEach(function(s,i){ if(dp[i]==='done') c++; });
  return c;
}

/* ---------------- Stats ---------------- */
var ALL_SUBJECT_NAMES = ["পদার্থবিজ্ঞান","রসায়ন","উচ্চতর গণিত","সাধারণ গণিত","জীববিজ্ঞান","ইসলাম শিক্ষা","বাংলাদেশ ও বিশ্বপরিচয়","বাংলা","English","আইসিটি"];

function computeStats(){
  var completed = getCompletedDays();
  var completedCount = completed.length;
  var remaining = TOTAL_DAYS - completedCount;
  var overallPct = Math.round((completedCount/TOTAL_DAYS)*100);
  var revisionDays = DAYS.filter(function(d){return d.type==='revision';});
  var revisionCompleted = revisionDays.filter(function(d){return completed.indexOf(d.day)!==-1;}).length;
  var revisionPct = revisionDays.length ? Math.round((revisionCompleted/revisionDays.length)*100) : 0;

  var subjTotals = {}; var subjDone = {};
  ALL_SUBJECT_NAMES.forEach(function(n){subjTotals[n]=0;subjDone[n]=0;});
  DAYS.forEach(function(d){
    d.subjects.forEach(function(s){
      if(s.subject==='সাপ্তাহিক রিভিশন') return;
      if(!(s.subject in subjTotals)){subjTotals[s.subject]=0;subjDone[s.subject]=0;}
      subjTotals[s.subject]++;
    });
  });
  var prog = getProgress();
  DAYS.forEach(function(d){
    d.subjects.forEach(function(s,i){
      if(s.subject==='সাপ্তাহিক রিভিশন') return;
      var st = prog[d.day] && prog[d.day][i];
      if(st==='done') subjDone[s.subject] = (subjDone[s.subject]||0)+1;
    });
  });

  return {
    completedCount: completedCount, remaining: remaining, overallPct: overallPct,
    revisionTotal: revisionDays.length, revisionCompleted: revisionCompleted, revisionPct: revisionPct,
    subjTotals: subjTotals, subjDone: subjDone
  };
}

  if(isRevisionBlock && subj.covered){
    block.appendChild(el('div',{class:'covered-note'},['📚 এই সপ্তাহে যেসব বিষয় পড়া হয়েছে: '+subj.covered]));
  }

  var taskList = el('ul',{class:'task-list'});
  subj.tasks.forEach(function(t,i){
    taskList.appendChild(el('li',{},[el('span',{class:'tnum'},[(i+1)+'.']), el('span',{},[t])]));
  });
  block.appendChild(taskList);

  var currentStatus = getDaySubjectStatus(dayNum, idx);
  var statusRow = el('div',{class:'status-row'});
  var radioGroup = el('div',{class:'radio-group'});

  var doneOpt = el('label',{class:'radio-opt'+(currentStatus==='done'?' done':'')},[

  ]);
  var doneRadio = el('input',{type:'radio', name:'status-'+dayNum+'-'+idx});
  doneRadio.checked = currentStatus==='done';
  doneRadio.addEventListener('change', function(){
    setDaySubjectStatus(dayNum, idx, 'done');
    render();
    var day = state.activeDay;
    window.scrollTo({top:0, behavior:'instant'});
    state.activeDay = day;
  });
  doneOpt.prepend(doneRadio);

  var notDoneOpt = el('label',{class:'radio-opt'+(currentStatus==='notdone'?' notdone':'')},[
    el('span',{class:'dot'}), el('span',{},['○ এখনও কাজ চলছে'])

  notDoneRadio.checked = currentStatus==='notdone';
  notDoneRadio.addEventListener('change', function(){
    setDaySubjectStatus(dayNum, idx, 'notdone');

  });
  notDoneOpt.prepend(notDoneRadio);

  radioGroup.appendChild(doneOpt);
  radioGroup.appendChild(notDoneOpt);
  statusRow.appendChild(radioGroup);
  block.appendChild(statusRow);

  return block;
}

function completeDay(dayNum){
  var completed = getCompletedDays();
  if(completed.indexOf(dayNum)===-1){ completed.push(dayNum); setCompletedDays(completed); }
  if(dayNum >= getCurrentDay() && dayNum < TOTAL_DAYS){ setCurrentDay(dayNum+1); }
  else if(dayNum===TOTAL_DAYS){ setCurrentDay(TOTAL_DAYS); }
  showCongrats(dayNum);
}

/* ---------- CONGRATS MODAL + CONFETTI ---------- */
function showCongrats(dayNum){
  var overlay = el('div',{class:'modal-overlay'});
  var card = el('div',{class:'congrats-card'});
  var isLast = dayNum===TOTAL_DAYS;
  var nextDay = dayNum+1;

  card.appendChild(el('div',{class:'check-circle', html:'<svg viewBox="0 0 52 52"><path d="M14 27 L22 35 L39 16"/></svg>'}));
  card.appendChild(el('h2',{},['🎉 অভিনন্দন!']));
  card.appendChild(el('div',{class:'sub'},['Day '+dayNum+'-এর কাজ সফলভাবে সাবমিট হয়েছে ✓']));

  if(isLast){
    card.appendChild(el('div',{class:'msg'},['ধন্যবাদ! তুমি সম্পূর্ণ ৯০ দিনের রুটিন শেষ করেছ। এটা তোমার অসাধারণ পরিশ্রমের ফল — এখন ভালোভাবে বিশ্রাম নাও এবং পরীক্ষার জন্য প্রস্তুত হও।']));
    card.appendChild(el('button',{class:'btn btn-primary btn-block', onclick:function(){
      overlay.remove(); state.view='dashboard'; render();
      toast('অভিনন্দন! তুমি সম্পূর্ণ ৯০ দিনের রুটিন শেষ করেছ 🎓');
    }},['ড্যাশবোর্ডে ফিরুন 🎓']));
  } else {
    card.appendChild(el('div',{class:'msg'},['আজকের কাজ সাবমিট হওয়ার সাথে সাথে Day '+nextDay+' এখন আনলক হয়ে গেছে। তুমি চাইলে আজই Day '+nextDay+'-এর কাজ শুরু করতে পারো, অথবা আজ এখানেই বিশ্রাম নিয়ে আগামীকাল এটা ধরতে পারো — তোমার অগ্রগতি সব সময় সংরক্ষিত থাকবে, দিনটি হারিয়ে যাবে না।']));
    var btnRow = el('div',{style:'display:flex;flex-direction:column;gap:10px;'});
    btnRow.appendChild(el('button',{class:'btn btn-primary btn-block', onclick:function(){
      overlay.remove();
      state.activeDay = nextDay; state.view='day';
      render();
      window.scrollTo({top:0, behavior:'smooth'});
      toast('Day '+nextDay+' আনলক হয়েছে — শুরু করো!');
    }},['এখনই Day '+nextDay+' শুরু করি →']));
    btnRow.appendChild(el('button',{class:'btn btn-ghost btn-block', onclick:function(){
      overlay.remove();
      state.view='dashboard';
      render();
      toast('ঠিক আছে! Day '+nextDay+' তোমার জন্য অপেক্ষা করবে।');
    }},['আজ থাক, আগামীকাল করব']));
    card.appendChild(btnRow);
  }

  overlay.appendChild(card);
  document.body.appendChild(overlay);
  launchConfetti();
}
function launchConfetti(){
  var colors = ['#f3cd6f','#3ee0c2','#ff7a68','#ffffff','#e0b24d'];
  for(var i=0;i<70;i++){
    (function(){
      var p = document.createElement('div');
      p.className='confetti-piece';
      p.style.left = (Math.random()*100)+'vw';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.width = (5+Math.random()*6)+'px';
      p.style.height = (8+Math.random()*10)+'px';
      p.style.borderRadius = Math.random()>0.5? '50%':'2px';
      p.style.animationDuration = (2.2+Math.random()*2.2)+'s';
      p.style.animationDelay = (Math.random()*0.6)+'s';
      document.body.appendChild(p);
      setTimeout(function(){ p.remove(); }, 5200);
    })();
  }
}

  ]));

  grid.appendChild(el('div',{class:'settings-card'},[
    el('h4',{},['🗑 সম্পূর্ণ ডেটা মুছুন']),
    el('p',{},['প্রোফাইল সহ সমস্ত তথ্য মুছে যাবে এবং তুমি নতুন করে শুরু করবে।']),
    el('button',{class:'btn btn-danger btn-block', onclick:function(){ confirmReset('all'); }},['সব ডেটা মুছে ফেলো'])
  ]));

  wrap.appendChild(grid);
  return wrap;
}

function confirmReset(mode){
  var overlay = el('div',{class:'modal-overlay'});
  var card = el('div',{class:'modal-card confirm-card'});
  card.appendChild(el('div',{class:'warn-ico'},['⚠️']));
  card.appendChild(el('h2',{},[mode==='all'? 'সব ডেটা মুছে ফেলবে?' : 'অগ্রগতি রিসেট করবে?']));
  card.appendChild(el('p',{class:'modal-desc'},[mode==='all'
    ? 'এই কাজটি সম্পূর্ণ অপরিবর্তনীয়। তোমার প্রোফাইল, অগ্রগতি এবং সব নোট স্থায়ীভাবে মুছে যাবে।'
    : 'তোমার সম্পন্ন দিন, টাস্ক স্ট্যাটাস এবং নোট মুছে যাবে। এই কাজটি ফিরিয়ে আনা যাবে না।']));
  var actions = el('div',{class:'modal-actions'});
  actions.appendChild(el('button',{class:'btn btn-ghost btn-block', onclick:function(){ overlay.remove(); }},['বাতিল']));
  actions.appendChild(el('button',{class:'btn btn-danger btn-block', onclick:function(){
    if(mode==='all'){
      Object.keys(KEYS).forEach(function(k){ localStorage.removeItem(KEYS[k]); });
      overlay.remove();
      state.view='hero';
      render();
      toast('সব ডেটা মুছে ফেলা হয়েছে।');
    } else {
      localStorage.removeItem(KEYS.progress);
      localStorage.removeItem(KEYS.notes);
      localStorage.removeItem(KEYS.completedDays);
      localStorage.removeItem(KEYS.currentDay);
      overlay.remove();
      state.view='dashboard';
      render();
      toast('অগ্রগতি রিসেট হয়েছে।');
    }
  }},['নিশ্চিত করো, মুছে ফেলো']));
  card.appendChild(actions);
  overlay.appendChild(card);
  document.body.appendChild(overlay);
}

/* ---------------- Particle background ---------------- */
function initParticles(){
  var canvas = document.getElementById('particle-canvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var W,H;
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  var count = window.innerWidth<640? 35:70;
  for(var i=0;i<count;i++){
    particles.push({
      x: Math.random()*W, y: Math.random()*H,
      r: 0.6+Math.random()*1.8,
      vx: (Math.random()-0.5)*0.15, vy: (Math.random()-0.5)*0.15,
      hue: Math.random()>0.5? 'rgba(243,205,111,' : 'rgba(62,224,194,',
      alpha: 0.15+Math.random()*0.35
    });
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0) p.x=W; if(p.x>W) p.x=0;
      if(p.y<0) p.y=H; if(p.y>H) p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.hue+p.alpha+')';
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  tick();
}

/* ---------------- Init ---------------- */
function init(){
  initParticles();
  var profile = getProfile();
  if(profile){ state.view='dashboard'; }
  else { state.view='hero'; }
  render();
}
init();
